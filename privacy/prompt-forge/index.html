<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROMPT FORGE – Privacy Policy | MP CREATIVE FORGE</title>
<meta name="description" content="Privacy policy of PROMPT FORGE, the local-first Android prompt vault by MP CREATIVE FORGE.">
<meta name="robots" content="index,follow">
<style>
  :root{
    --bg:#0a0b0d; --surface:#101216; --border:#23272e; --text:#f2f2f0; --dim:#aeb2ba; --faint:#7d828b; --gold:#c9a55c;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f5f1; --surface:#ffffff; --border:#dcd9d0; --text:#16171a; --dim:#4a4e56; --faint:#6b707a; --gold:#8a6a1f; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px}
  header{text-align:center;padding:24px 0 8px}
  .brand{font-weight:700;letter-spacing:.28em;font-size:22px}
  .tag{color:var(--gold);letter-spacing:.18em;font-size:12px;font-weight:600;margin-top:6px}
  h1{font-size:28px;margin:36px 0 4px}
  .meta{color:var(--faint);font-size:14px;margin:0 0 20px}
  .lang{display:flex;gap:8px;margin:20px 0 0;justify-content:center}
  .lang button{font:inherit;font-size:13px;letter-spacing:.12em;font-weight:600;color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:6px;padding:8px 16px;cursor:pointer}
  .lang button[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
  h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:36px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  h2 span{color:var(--faint);margin-right:10px}
  p,li{color:var(--dim)} strong{color:var(--text)}
  ul{padding-left:20px} li{margin:6px 0}
  .box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin:16px 0}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
  td{border-top:1px solid var(--border);padding:10px 8px;vertical-align:top;color:var(--dim)}
  td:first-child{width:34%;color:var(--gold);font-weight:600;letter-spacing:.04em}
